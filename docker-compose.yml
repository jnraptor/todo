version: '3.8'

services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
        - REACT_APP_REDIRECT_URL=${REACT_APP_REDIRECT_URL}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: todo-app

  # Optional: Add a development service
  todo-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    container_name: todo-app-dev
    profiles:
      - dev

  # Test service - runs tests and exits
  todo-app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
    environment:
      - CI=true
      - NODE_ENV=test
    container_name: todo-app-test
    profiles:
      - test

  # Test service using main Dockerfile test stage
  todo-app-test-main:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
    environment:
      - CI=true
      - NODE_ENV=test
    container_name: todo-app-test-main
    profiles:
      - test